name: Mhoo AI review
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open PR number to review
        required: true
        type: string
permissions:
  contents: read
  pull-requests: write
  id-token: write
concurrency:
  group: mhoo-ai-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false
jobs:
  review:
    if: github.repository_owner == 'mhoo-os' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch pinned reviewer (no PR checkout)
        env:
          RUNNER_HASH: 5260fd7e5bf97d2f4628838029a6d4e15b77a347133d0bf2526b5d4edf6a1171
        run: |
          curl --fail --silent --show-error --max-time 30 --proto '=https' 'https://mhoo-ai-review.mhoo-app.workers.dev/runner/5260fd7e5bf97d2f4628838029a6d4e15b77a347133d0bf2526b5d4edf6a1171.mjs' -o "$RUNNER_TEMP/mhoo-review.mjs"
          echo "$RUNNER_HASH  $RUNNER_TEMP/mhoo-review.mjs" | sha256sum --check --status
      - name: Review current PR head and update comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/mhoo-review.mjs"
  repair:
    needs: review
    if: vars.MHOO_REPAIR_ENABLED == 'true'
    permissions:
      contents: read
      actions: read
      checks: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Fetch pinned repair supervisor (no PR checkout)
        env:
          RUNNER_HASH: e94eb3035c1617baef181971cefdfa979ef37676bc8a26aab76003cf46ac5658
        run: |
          curl --fail --silent --show-error --max-time 30 --proto '=https' 'https://mhoo-ai-review.mhoo-app.workers.dev/repair-runner/e94eb3035c1617baef181971cefdfa979ef37676bc8a26aab76003cf46ac5658.mjs' -o "$RUNNER_TEMP/mhoo-repair.mjs"
          echo "$RUNNER_HASH  $RUNNER_TEMP/mhoo-repair.mjs" | sha256sum --check --status
      - name: Prepare pinned isolated test image
        run: docker pull --platform linux/amd64 node@sha256:5cbc7caba8c2c0f0bca675d1b61b9f2857e1cf1853c6164ee9dd409501a936e7
      - name: Run one bounded repair attempt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/mhoo-repair.mjs"
  verdict-publisher:
    needs: [review, repair]
    if: always() && !cancelled() && needs.review.result == 'success' && (needs.repair.result == 'success' || needs.repair.result == 'skipped')
    permissions:
      contents: read
      checks: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Fetch pinned verdict publisher (no PR checkout)
        env:
          RUNNER_HASH: adbac2828d0e1476f06eac1c19c44d4d7f2a13013a70042f43767cceebdd1152
        run: |
          curl --fail --silent --show-error --max-time 30 --proto '=https' 'https://mhoo-ai-review.mhoo-app.workers.dev/verdict-runner/adbac2828d0e1476f06eac1c19c44d4d7f2a13013a70042f43767cceebdd1152.mjs' -o "$RUNNER_TEMP/mhoo-verdict.mjs"
          echo "$RUNNER_HASH  $RUNNER_TEMP/mhoo-verdict.mjs" | sha256sum --check --status
      - name: Collect independent cloud verdict and publish bound check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/mhoo-verdict.mjs"
