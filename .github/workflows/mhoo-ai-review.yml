name: Mhoo AI review
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open PR number to review
        required: true
        type: string
permissions:
  contents: read
  pull-requests: write
  id-token: write
concurrency:
  group: mhoo-ai-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false
jobs:
  review:
    if: github.repository_owner == 'mhoo-os' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch pinned reviewer (no PR checkout)
        env:
          RUNNER_HASH: 555df1dd70bb412ae904ffcfde44a308a4c5a5253b9c053a28441054341cf48f
        run: |
          curl --fail --silent --show-error --max-time 30 --proto '=https' 'https://mhoo-ai-review.mhoo-app.workers.dev/runner/555df1dd70bb412ae904ffcfde44a308a4c5a5253b9c053a28441054341cf48f.mjs' -o "$RUNNER_TEMP/mhoo-review.mjs"
          echo "$RUNNER_HASH  $RUNNER_TEMP/mhoo-review.mjs" | sha256sum --check --status
      - name: Review current PR head and update comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/mhoo-review.mjs"
  repair:
    needs: review
    if: vars.MHOO_REPAIR_ENABLED == 'true'
    permissions:
      contents: read
      actions: read
      checks: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Fetch pinned repair supervisor (no PR checkout)
        env:
          RUNNER_HASH: 9ebf14858e05dba91631e5fe4a28f6109a8153cc4da5dacfb2be485ad840f0a4
        run: |
          curl --fail --silent --show-error --max-time 30 --proto '=https' 'https://mhoo-ai-review.mhoo-app.workers.dev/repair-runner/9ebf14858e05dba91631e5fe4a28f6109a8153cc4da5dacfb2be485ad840f0a4.mjs' -o "$RUNNER_TEMP/mhoo-repair.mjs"
          echo "$RUNNER_HASH  $RUNNER_TEMP/mhoo-repair.mjs" | sha256sum --check --status
      - name: Prepare pinned isolated test image
        run: docker pull --platform linux/amd64 node@sha256:5cbc7caba8c2c0f0bca675d1b61b9f2857e1cf1853c6164ee9dd409501a936e7
      - name: Run one bounded repair attempt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/mhoo-repair.mjs"
  verdict-publisher:
    needs: [review, repair]
    if: always() && !cancelled() && needs.review.result == 'success' && (needs.repair.result == 'success' || needs.repair.result == 'skipped')
    permissions:
      contents: read
      checks: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Fetch pinned verdict publisher (no PR checkout)
        env:
          RUNNER_HASH: 7db147565cd9ded5f1f39507ff213dd2c9843ddddabe8b6072392b0f44fcac50
        run: |
          curl --fail --silent --show-error --max-time 30 --proto '=https' 'https://mhoo-ai-review.mhoo-app.workers.dev/verdict-runner/7db147565cd9ded5f1f39507ff213dd2c9843ddddabe8b6072392b0f44fcac50.mjs' -o "$RUNNER_TEMP/mhoo-verdict.mjs"
          echo "$RUNNER_HASH  $RUNNER_TEMP/mhoo-verdict.mjs" | sha256sum --check --status
      - name: Collect independent cloud verdict and publish bound check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/mhoo-verdict.mjs"
