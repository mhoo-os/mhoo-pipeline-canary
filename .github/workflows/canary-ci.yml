name: Canary CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  canary-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: node baseline.mjs
      - name: Verify repair regression when present
        run: |
          if [ -f regression.mjs ]; then
            node regression.mjs
          fi
      - name: Verify protected range baseline
        run: node range-baseline.mjs
      - name: Verify lower-bound behavior independently of generated regression
        run: node --input-type=module -e "import assert from 'node:assert/strict'; import {clamp} from './range.mjs'; assert.equal(clamp(-1,0,10),0);"
      - name: Verify range repair regression when present
        run: |
          if [ -f range-regression.mjs ]; then
            node range-regression.mjs
          fi
